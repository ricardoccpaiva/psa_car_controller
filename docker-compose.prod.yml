version: '3.8'

services:
  psacc:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: psacc-production
    ports:
      - "5000:5000"
    volumes:
      - ./config:/config
      - ./config.ini:/app/config.ini
    environment:
      - PSACC_CONFIG_DIR=/config
      - PSACC_PORT=5000
      - PSACC_HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/get_vehicles"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
